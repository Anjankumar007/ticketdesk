<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>TicketDesk</title>
<style>
:root{--bg1:#f3f0ff;--bg2:#e3f6fb;--card:#fff;--ink:#1d1b3a;--mute:#6b6a8a;--line:#e3e1f2;--g1:#4f46e5;--g2:#9333ea;--g3:#ec4899;--cy:#06b6d4;--ok:#10b981;--bad:#e11d48;--gold:#fbbf24;--taken:#d9d7e8;--sh:0 8px 24px rgba(79,70,229,.13);--main:linear-gradient(120deg,#4f46e5,#9333ea 55%,#ec4899)}
@media(prefers-color-scheme:dark){:root{--bg1:#120f2b;--bg2:#0b1d2a;--card:#1c1940;--ink:#f1efff;--mute:#a9a6d0;--line:#34306a;--taken:#3a3670;--sh:0 8px 24px rgba(0,0,0,.4)}}
*{box-sizing:border-box}
body{margin:0;min-height:100vh;color:var(--ink);font:15px/1.5 "Segoe UI",system-ui,sans-serif;background:linear-gradient(135deg,var(--bg1),var(--bg2)) fixed}
header{display:flex;align-items:center;gap:18px;flex-wrap:wrap;padding:14px 28px;background:var(--main);color:#fff;box-shadow:var(--sh);position:sticky;top:0;z-index:20}
.brand{font-size:21px;font-weight:800;letter-spacing:.3px}
nav{display:flex;gap:6px;flex-wrap:wrap}
nav button{border:0;background:transparent;color:#fff;padding:8px 16px;border-radius:99px;font:inherit;cursor:pointer;opacity:.85}
nav button:hover{background:rgba(255,255,255,.18)}nav button.on{background:#fff;color:var(--g2);font-weight:700;opacity:1}
main{max-width:1280px;margin:0 auto;padding:26px 28px 120px}
h2{margin:0 0 16px;font-size:24px}
.hero{background:var(--main);color:#fff;border-radius:20px;padding:30px;margin-bottom:22px;box-shadow:var(--sh);position:relative;overflow:hidden}
.hero:after{content:"";position:absolute;right:-60px;top:-60px;width:240px;height:240px;border-radius:50%;background:radial-gradient(#fff3,#fff0 70%)}
.hero h1{margin:0 0 4px;font-size:30px}.hero p{margin:0 0 18px;opacity:.9}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
input,select{font:inherit;padding:10px 14px;border-radius:12px;border:1px solid var(--line);background:var(--card);color:var(--ink)}
.hero input{flex:1;min-width:220px;border:0}
.chip{border:1px solid #fff8;background:#fff2;color:#fff;padding:8px 16px;border-radius:99px;cursor:pointer;font:inherit}
.chip.on{background:#fff;color:var(--g2);font-weight:700}
.btn{border:0;border-radius:12px;padding:10px 20px;font:inherit;font-weight:600;color:#fff;background:var(--main);cursor:pointer;box-shadow:0 4px 12px rgba(147,51,234,.3);transition:transform .15s}
.btn:hover:not(:disabled){transform:translateY(-2px)}.btn:disabled{opacity:.45;cursor:not-allowed}
.btn.soft{background:var(--card);color:var(--ink);box-shadow:none;border:1px solid var(--line)}.btn.red{background:linear-gradient(120deg,#e11d48,#f97316)}
:focus-visible{outline:3px solid var(--cy);outline-offset:2px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(270px,1fr));gap:20px}
.card{background:var(--card);border-radius:18px;box-shadow:var(--sh);overflow:hidden;border:1px solid var(--line);transition:transform .2s}
.card:hover{transform:translateY(-4px)}
.band{height:84px;display:flex;align-items:flex-end;justify-content:space-between;padding:10px 16px;color:#fff;font-weight:700}
.band .em{font-size:34px}.band span{background:#0003;padding:2px 10px;border-radius:99px;font-size:12px;text-transform:capitalize}
.body{padding:14px 16px 16px}.body h3{margin:0 0 4px;font-size:17px}.sub{color:var(--mute);font-size:13px}
.bar{height:6px;border-radius:9px;background:var(--line);margin:12px 0;overflow:hidden}.bar i{display:block;height:100%;background:linear-gradient(90deg,var(--cy),var(--g2))}
.foot{display:flex;justify-content:space-between;align-items:center}.price{font-size:19px;font-weight:800;color:var(--g1)}
.ev{border-radius:18px;padding:22px 26px;color:#fff;display:flex;gap:16px;align-items:center;flex-wrap:wrap;box-shadow:var(--sh);margin-bottom:18px}
.ev .em{font-size:44px}.ev h2{margin:0;color:#fff}.ev .meta{opacity:.92}.ev .btn{margin-left:auto}
.map{background:var(--card);border-radius:20px;padding:26px;box-shadow:var(--sh);border:1px solid var(--line);width:100%}
.stage{margin:0 auto 24px;width:70%;text-align:center;padding:8px;color:#fff;font-weight:700;letter-spacing:6px;font-size:13px;background:var(--main);border-radius:0 0 60px 60px/0 0 28px 28px;box-shadow:0 10px 24px rgba(147,51,234,.35)}
.sec{font-weight:700;margin:16px 0 10px;display:flex;align-items:center;gap:10px}.sec small{color:var(--mute);font-weight:400}
.seats{display:grid;grid-template-columns:repeat(auto-fill,minmax(58px,1fr));gap:10px}
.seat{aspect-ratio:1;border-radius:12px 12px 6px 6px;border:2px solid var(--cy);background:linear-gradient(180deg,#06b6d422,#4f46e511);color:var(--ink);font:inherit;font-weight:700;cursor:pointer;transition:all .12s}
.seat.vip{border-color:var(--gold);background:linear-gradient(180deg,#fbbf2433,#f9731611)}
.seat:hover:not(.taken){transform:scale(1.1)}
.seat.taken{background:var(--taken);border-color:var(--taken);color:var(--mute);cursor:not-allowed}
.seat.sel{background:var(--main);border-color:transparent;color:#fff;transform:scale(1.08);box-shadow:0 6px 14px rgba(147,51,234,.45)}
.legend{display:flex;gap:18px;flex-wrap:wrap;margin-top:20px;color:var(--mute);font-size:13px}
.legend i{display:inline-block;width:14px;height:14px;border-radius:4px;margin-right:6px;vertical-align:-2px;border:2px solid var(--cy)}
.dock{position:fixed;left:0;right:0;bottom:0;z-index:30;background:var(--card);border-top:1px solid var(--line);box-shadow:0 -8px 28px rgba(79,70,229,.18);padding:12px 28px;display:flex;gap:18px;align-items:center;flex-wrap:wrap}
.qty{display:flex;align-items:center;gap:8px}.qty button{width:34px;height:34px;border-radius:50%;border:1px solid var(--line);background:var(--card);color:var(--ink);font-size:18px;cursor:pointer}
.qty b{min-width:26px;text-align:center;font-size:18px}
.dock .sum{flex:1;min-width:180px}.dock .sum b{font-size:20px;color:var(--g1)}
table{width:100%;border-collapse:collapse}
.tw{overflow-x:auto;background:var(--card);border-radius:16px;box-shadow:var(--sh);border:1px solid var(--line)}
th{background:var(--main);color:#fff;text-align:left;padding:12px 16px;font-size:13px;white-space:nowrap}
td{padding:11px 16px;border-bottom:1px solid var(--line);white-space:nowrap}tr:last-child td{border:0}
.pill{padding:2px 12px;border-radius:99px;font-size:12px;font-weight:700;background:#10b98122;color:var(--ok)}.pill.c{background:#4f46e522;color:var(--g1)}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:16px}
.kpi{border-radius:18px;padding:22px;color:#fff;box-shadow:var(--sh)}.kpi b{display:block;font-size:30px}.kpi span{opacity:.9}
.tabs{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:18px}
.tab{border:1px solid var(--line);background:var(--card);color:var(--ink);padding:9px 18px;border-radius:99px;cursor:pointer;font:inherit}
.tab.on{background:var(--main);color:#fff;border-color:transparent}
.tool{padding:20px}.tool .em{font-size:30px}.tool h3{margin:6px 0 4px}.tool p{margin:0 0 14px;color:var(--mute);font-size:14px}
.note{border-radius:14px;padding:14px 18px;margin-top:18px;border:1px solid var(--line);background:var(--card);box-shadow:var(--sh)}
.note.ok{border-left:6px solid var(--ok)}.note.bad{border-left:6px solid var(--bad)}
#toast{position:fixed;top:76px;right:20px;z-index:60;display:flex;flex-direction:column;gap:8px}
.t{padding:12px 18px;border-radius:12px;color:#fff;box-shadow:var(--sh);animation:in .25s;max-width:340px}
.t.ok{background:linear-gradient(120deg,#059669,#10b981)}.t.bad{background:linear-gradient(120deg,#e11d48,#f97316)}
@keyframes in{from{opacity:0;transform:translateX(30px)}}
.modal{position:fixed;inset:0;background:#0008;z-index:50;display:flex;align-items:center;justify-content:center;padding:20px}
.mbox{background:var(--card);border-radius:22px;padding:30px;max-width:420px;width:100%;text-align:center;box-shadow:0 20px 60px #0006}
.mbox .big{font-size:52px}.mbox h2{margin:6px 0}
.empty{text-align:center;color:var(--mute);padding:50px}
</style>
</head>
<body>
<header><div class="brand">🎟️ TicketDesk</div><nav id="nav"></nav></header>
<main id="app"></main>
<div id="toast"></div>

<script>
const $=s=>document.querySelector(s), app=$("#app");
const esc=s=>String(s??"").replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const inr=n=>"₹"+Math.round(Number(n)).toLocaleString("en-IN");
const fmtDate=d=>new Date(d+"T00:00").toLocaleDateString("en-IN",{day:"numeric",month:"short",year:"numeric"});
const THEME={concert:["🎤","linear-gradient(135deg,#9333ea,#ec4899)"],movie:["🎬","linear-gradient(135deg,#4f46e5,#06b6d4)"],sports:["🏟️","linear-gradient(135deg,#059669,#06b6d4)"]};

async function api(method,path,body){
  const r=await fetch(path,{method,headers:{"Content-Type":"application/json"},body:body?JSON.stringify(body):undefined});
  const j=await r.json().catch(()=>({}));
  if(!r.ok){const e=new Error(j.error||"Request failed");e.status=r.status;throw e}
  return j;
}
function friendly(e){          // turns database errors into plain language (raw text stays in the browser console)
  console.error(e.message);
  if(e instanceof TypeError) return "Can’t reach the server. Make sure app.py is running.";
  const n=(/Error (\d+)/.exec(e.message)||[])[1];
  return ({1062:"That seat is already booked.",1452:"That customer ID or seat doesn’t exist.",3819:"Prices must be greater than zero.",1451:"That venue can’t be deleted because it still has events.",1045:"Database login failed. Check the password in db.py.",2003:"Can’t reach MySQL. Is the server running?"})[n]||"Something went wrong. Please try again.";
}
function toast(msg,kind="ok"){const d=document.createElement("div");d.className="t "+kind;d.textContent=msg;$("#toast").append(d);setTimeout(()=>d.remove(),3800)}

const TABS=[["events","Events"],["bookings","My Bookings"],["reports","Reports"],["admin","Admin"]];
let EV=[];
function go(v,arg){
  location.hash=v;
  app.onclick=null;
  $("#nav").innerHTML=TABS.map(([k,l])=>`<button class="${k===v||(v==="seats"&&k==="events")?"on":""}" onclick="go('${k}')">${l}</button>`).join("");
  window.scrollTo(0,0);
  ({events:viewEvents,seats:viewSeats,bookings:viewBookings,reports:viewReports,admin:viewAdmin}[v]||viewEvents)(arg);
}

/* ---------------- Events ---------------- */
let F={q:"",type:"",sort:"event_date"};
async function viewEvents(){
  const chips=[["","All"],["concert","🎤 Concerts"],["movie","🎬 Movies"],["sports","🏟️ Sports"]];
  app.innerHTML=`<div class="hero"><h1>Find your next experience</h1><p>Concerts, movies and matches. Pick your seats in seconds.</p>
    <div class="row"><input id="q" placeholder="Search events…" value="${esc(F.q)}" aria-label="Search events">
    <select id="s" aria-label="Sort"><option value="event_date">Soonest first</option><option value="base_price">Lowest price</option><option value="title">A to Z</option></select></div>
    <div class="row" style="margin-top:14px" id="chips">${chips.map(([k,l])=>`<button class="chip ${F.type===k?"on":""}" data-t="${k}">${l}</button>`).join("")}</div></div>
    <div id="list" class="grid"><p class="empty">Loading events…</p></div>`;
  $("#s").value=F.sort;
  const load=async()=>{
    F.q=$("#q").value;F.sort=$("#s").value;
    try{
      EV=await api("GET",`/api/events?q=${encodeURIComponent(F.q)}&type=${F.type}&sort=${F.sort}`);
      $("#list").innerHTML=EV.length?EV.slice(0,60).map(e=>{const[t,g]=THEME[e.type]||THEME.concert,left=e.capacity-e.booked;
        return `<div class="card"><div class="band" style="background:${g}"><div class="em">${t}</div><span>${esc(e.type)}</span></div><div class="body"><h3>${esc(e.title)}</h3><div class="sub">${esc(e.venue)}, ${esc(e.city)}<br>${fmtDate(e.event_date)}</div><div class="bar"><i style="width:${Math.round(e.booked/e.capacity*100)}%"></i></div><div class="foot"><div><div class="price">${inr(e.base_price)}</div><div class="sub">${left} seats left</div></div><button class="btn" onclick="go('seats',${e.event_id})" ${left?"":"disabled"}>${left?"Select seats":"Sold out"}</button></div></div></div>`}).join(""):`<p class="empty">No events found. Try a different search.</p>`;
    }catch(x){$("#list").innerHTML=`<p class="empty">${esc(friendly(x))}</p>`}
  };
  $("#q").oninput=load;$("#s").onchange=load;
  $("#chips").onclick=e=>{const b=e.target.closest(".chip");if(!b)return;F.type=b.dataset.t;document.querySelectorAll(".chip").forEach(c=>c.classList.toggle("on",c===b));load()};
  load();
}

/* ---------------- Seat picker ---------------- */
async function viewSeats(eid){
  if(!eid){return go("events")}
  app.innerHTML=`<p class="empty">Loading seats…</p>`;
  let seats,ev=EV.find(e=>e.event_id===eid);
  try{seats=await api("GET",`/api/events/${eid}/seats`);if(!ev)ev=(await api("GET","/api/events?q=&type=&sort=event_date")).find(e=>e.event_id===eid)}
  catch(x){app.innerHTML=`<p class="empty">${esc(friendly(x))}</p>`;return}
  const [em,grad]=THEME[ev.type]||THEME.concert, price=s=>s.category==="VIP"?ev.base_price*1.5:ev.base_price;
  let sel=[],qty=1;
  app.innerHTML=`<div class="ev" style="background:${grad}"><div class="em">${em}</div><div><h2>${esc(ev.title)}</h2><div class="meta">${esc(ev.venue)}, ${esc(ev.city)} · ${fmtDate(ev.event_date)}</div></div><button class="btn soft" onclick="go('events')">← Back</button></div>
    <div class="map"><div class="stage">STAGE / SCREEN</div><div id="vip"></div><div id="reg"></div>
    <div class="legend"><span><i></i>Available</span><span><i style="border-color:var(--gold)"></i>VIP (1.5×)</span><span><i style="background:var(--g2);border-color:var(--g2)"></i>Selected</span><span><i style="background:var(--taken);border-color:var(--taken)"></i>Taken</span></div></div>
    <div class="dock"><div class="qty"><span class="sub">Seats</span><button id="m" aria-label="Fewer seats">−</button><b id="qv">1</b><button id="p" aria-label="More seats">+</button></div>
    <div class="sum"><div class="sub" id="st">Select 1 seat</div><b id="tot">₹0</b></div>
    <label class="sub">Customer ID <input id="uid" type="number" min="1" value="1" style="width:90px"></label><button class="btn" id="go" disabled>Confirm booking</button></div>`;
  const draw=()=>{
    const sec=(cat,title,note)=>{const L=seats.filter(s=>s.category===cat);return L.length?`<div class="sec">${title}<small>${note}</small></div><div class="seats">${L.map(s=>`<button class="seat ${cat==="VIP"?"vip":""} ${s.booked?"taken":""} ${sel.includes(s.seat_no)?"sel":""}" ${s.booked?"disabled":""} data-n="${s.seat_no}" aria-label="Seat ${s.seat_no}">${s.seat_no}</button>`).join("")}</div>`:""};
    $("#vip").innerHTML=sec("VIP","⭐ VIP",inr(ev.base_price*1.5)+" per seat");
    $("#reg").innerHTML=sec("Regular","Regular",inr(ev.base_price)+" per seat");
    const total=sel.reduce((a,n)=>a+price(seats.find(s=>s.seat_no===n)),0);
    $("#qv").textContent=qty;$("#tot").textContent=inr(total);
    $("#st").textContent=sel.length?`Seat${sel.length>1?"s":""} ${sel.slice().sort((a,b)=>a-b).join(", ")} (${sel.length} of ${qty})`:`Select ${qty} seat${qty>1?"s":""}`;
    $("#go").disabled=sel.length!==qty;
  };
  app.onclick=e=>{const b=e.target.closest(".seat");if(!b||b.disabled)return;const n=+b.dataset.n;
    if(sel.includes(n))sel=sel.filter(x=>x!==n);else{if(sel.length>=qty)sel.shift();sel.push(n)}draw()};
  $("#m").onclick=()=>{qty=Math.max(1,qty-1);sel=sel.slice(-qty);draw()};
  $("#p").onclick=()=>{qty=Math.min(8,qty+1);draw()};
  $("#go").onclick=async()=>{
    $("#go").disabled=true;
    try{
      const r=await api("POST","/api/bookings",{user_id:+$("#uid").value,event_id:eid,seat_nos:sel});
      const total=$("#tot").textContent,list=sel.slice().sort((a,b)=>a-b).join(", ");
      const m=document.createElement("div");m.className="modal";
      m.innerHTML=`<div class="mbox"><div class="big">🎉</div><h2>You’re booked!</h2><p class="sub">${esc(ev.title)}<br>Seats ${list} · ${total}<br>Booking ${r.booking_ids.map(i=>"#"+i).join(", ")}</p><div class="row" style="justify-content:center"><button class="btn soft" id="again">Book more</button><button class="btn" id="mine">View bookings</button></div></div>`;
      document.body.append(m);
      m.querySelector("#again").onclick=()=>{m.remove();viewSeats(eid)};m.querySelector("#mine").onclick=()=>{m.remove();go("bookings")};
    }catch(x){toast(friendly(x),"bad");seats=await api("GET",`/api/events/${eid}/seats`);sel=sel.filter(n=>!seats.find(s=>s.seat_no===n).booked);draw()}
  };
  draw();
}

/* ---------------- Bookings ---------------- */
async function viewBookings(){
  app.innerHTML=`<h2>My Bookings</h2><div id="box"><p class="empty">Loading…</p></div>`;
  const draw=async()=>{
    try{const rows=await api("GET","/api/bookings");
      $("#box").innerHTML=rows.length?`<div class="tw"><table><thead><tr><th>#</th><th>Customer</th><th>Event</th><th>Seat</th><th>Paid</th><th>Status</th><th>Booked on</th><th></th></tr></thead><tbody>${rows.map(b=>`<tr><td>${b.booking_id}</td><td>${esc(b.user)}</td><td>${esc(b.event)}</td><td>${b.seat_no}</td><td>${inr(b.price)}</td><td><span class="pill ${b.status==="completed"?"c":""}">${esc(b.status)}</span></td><td>${esc(String(b.booked_at).slice(0,10))}</td><td><button class="btn red" data-id="${b.booking_id}">Cancel</button></td></tr>`).join("")}</tbody></table></div>`:`<p class="empty">No bookings yet.</p>`;
    }catch(x){$("#box").innerHTML=`<p class="empty">${esc(friendly(x))}</p>`}
  };
  app.onclick=async e=>{const b=e.target.closest("[data-id]");if(!b||!confirm("Cancel this booking?"))return;
    try{await api("DELETE","/api/bookings/"+b.dataset.id);toast("Booking cancelled.");draw()}catch(x){toast(friendly(x),"bad")}};
  draw();
}

/* ---------------- Reports ---------------- */
const REPORTS=[["dashboard","Overview"],["bookings_per_event","Top events"],["revenue_per_venue","Venue revenue"],["zero_bookings","No bookings yet"],["referrals","Referrals"],["above_venue_avg","Premium events"]];
const KG=["linear-gradient(135deg,#4f46e5,#9333ea)","linear-gradient(135deg,#9333ea,#ec4899)","linear-gradient(135deg,#06b6d4,#4f46e5)","linear-gradient(135deg,#059669,#06b6d4)"];
function viewReports(){
  app.innerHTML=`<h2>Reports</h2><div class="tabs" id="tabs">${REPORTS.map(([k,l])=>`<button class="tab" data-k="${k}">${l}</button>`).join("")}</div><div id="out"></div>`;
  const run=async k=>{
    document.querySelectorAll(".tab").forEach(t=>t.classList.toggle("on",t.dataset.k===k));
    $("#out").innerHTML=`<p class="empty">Loading…</p>`;
    try{const r=await api("GET","/api/reports/"+k);
      const money=c=>/revenue|price/i.test(c), cell=(c,v)=>typeof v==="number"&&money(c)?inr(v):esc(v);
      $("#out").innerHTML=`<h3>${esc(r.title.replace(/\s*\(.*\)/,""))}</h3>`+(k==="dashboard"&&r.rows[0]?`<div class="kpis">${r.columns.map((c,i)=>`<div class="kpi" style="background:${KG[i%4]}"><b>${cell(c,r.rows[0][i])}</b><span>${esc(c.replace(" (INR)",""))}</span></div>`).join("")}</div>`:
        r.rows.length?`<div class="tw"><table><thead><tr>${r.columns.map(c=>`<th>${esc(c)}</th>`).join("")}</tr></thead><tbody>${r.rows.map(row=>`<tr>${row.map((v,i)=>`<td>${cell(r.columns[i],v)}</td>`).join("")}</tr>`).join("")}</tbody></table></div>`:`<p class="empty">Nothing to show here.</p>`);
    }catch(x){$("#out").innerHTML=`<p class="empty">${esc(friendly(x))}</p>`}
  };
  $("#tabs").onclick=e=>{const t=e.target.closest(".tab");if(t)run(t.dataset.k)};
  run("dashboard");
}

/* ---------------- Admin ---------------- */
function viewAdmin(){
  const A=[["price_hike","📈","Raise concert prices 10%","Updates every concert in one go."],["complete_past","✅","Complete past bookings","Closes out bookings for events that already happened."],["archive_completed","📦","Archive completed bookings","Moves completed bookings out of the live list."]];
  const C=[["test_double_booking","🛡️","Double-booking check","Tries to book a seat that is already taken."],["test_negative_price","💸","Price check","Tries to set a negative price."],["test_delete_venue","🏛️","Venue protection check","Tries to delete a venue that still has events."]];
  const tool=(l,cls)=>l.map(([k,em,t,d])=>`<div class="card tool"><div class="em">${em}</div><h3>${t}</h3><p>${d}</p><button class="btn ${cls}" data-a="${k}">Run</button></div>`).join("");
  app.innerHTML=`<h2>Bulk actions</h2><div class="grid">${tool(A,"")}</div><h2 style="margin-top:30px">Data protection checks</h2><div class="grid">${tool(C,"red")}</div><div id="out"></div>`;
  app.onclick=async e=>{const b=e.target.closest("[data-a]");if(!b)return;const a=b.dataset.a,isTest=a.startsWith("test_");
    try{const r=await api("POST","/api/admin/"+a);toast(r.message);$("#out").innerHTML=`<div class="note ok"><b>Done.</b> ${esc(r.message)}</div>`}
    catch(x){const msg=friendly(x);
      if(isTest&&x.status!==500){toast("Blocked, as it should be.");$("#out").innerHTML=`<div class="note ok"><b>🛡️ Protected.</b> The database refused it: ${esc(msg)}</div>`}
      else{toast(msg,"bad");$("#out").innerHTML=`<div class="note bad"><b>Failed.</b> ${esc(msg)}</div>`}}};
}

go(location.hash.slice(1)==="seats"?"events":(location.hash.slice(1)||"events"));
</script>
</body>
